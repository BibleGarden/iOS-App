name: UI tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ui-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  API_BASE_URL: https://test-api.bible.garden
  DEVELOPER_DIR: /Applications/Xcode_26.3.app
  SIMULATOR_NAME: iPhone 17
  SIMULATOR_OS: "26.2"
  # App Store preview recording script, not a test.
  SKIPPED_CLASSES: DemoRecordingTests

jobs:
  # Secrets are not passed to workflows triggered from forks, so UI tests
  # cannot authenticate to the test API there. The skip is stated explicitly
  # instead of letting the job fail or silently pass without tests.
  fork-notice:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped UI tests
        run: echo "::notice title=UI tests skipped::Pull requests from forks have no access to the test API secrets. A maintainer runs UI tests after moving the branch into BibleGarden/iOS-App."

  build:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 45
    env:
      DERIVED_DATA: build/DerivedData
      SHARDS: 5
    outputs:
      shards: ${{ steps.shard.outputs.shards }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Write Debug.xcconfig
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: scripts/write-ci-debug-xcconfig.sh

      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes iOS

      - name: Boot simulator
        run: scripts/boot-ci-simulator.sh

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project BibleGarden.xcodeproj \
            -scheme BibleGarden \
            -testPlan BibleGarden \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath "$DERIVED_DATA" \
            -onlyUsePackageVersionsFromResolvedFile \
            -skipPackagePluginValidation \
            | xcbeautify --renderer github-actions

      # Every test class of the plan goes to exactly one shard, so a new class
      # is never left out. Classes are spread by test count, largest first.
      - name: Split test classes into shards
        id: shard
        run: |
          set -o pipefail
          xctestrun=$(ls "$DERIVED_DATA"/Build/Products/*.xctestrun)
          xcodebuild test-without-building \
            -xctestrun "$xctestrun" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -enumerate-tests \
            -test-enumeration-style hierarchical \
            -test-enumeration-format json \
            -test-enumeration-output-path build/tests.json \
            | xcbeautify
          jq -e '.errors == []' build/tests.json > /dev/null || { jq '.errors' build/tests.json; exit 1; }
          shards=$(jq -c --argjson n "$SHARDS" --arg skipped "$SKIPPED_CLASSES" '
            ($skipped | split(" ")) as $skip
            | [ .values[].children[] as $target
                | $target.children[]
                | select(.kind == "class" and (.name | IN($skip[]) | not))
                | {id: "\($target.name)/\(.name)", tests: (.children | length)} ]
            | if length == 0 then error("no test classes enumerated") else . end
            | sort_by(-.tests)
            | reduce .[] as $class ([range($n) | {tests: 0, ids: []}];
                (to_entries | min_by(.value.tests) | .key) as $i
                | .[$i].tests += $class.tests
                | .[$i].ids += [$class.id])
            | to_entries
            | map({index: (.key + 1), tests: .value.tests,
                   only_testing: (.value.ids | map("-only-testing:" + .) | join(" "))})' build/tests.json)
          echo "$shards" | jq -r '.[] | "Shard \(.index): \(.tests) tests"'
          echo "shards=$shards" >> "$GITHUB_OUTPUT"

      - name: Pack test products
        run: |
          cd "$DERIVED_DATA/Build/Products"
          tar -czf "$GITHUB_WORKSPACE/build/products.tar.gz" ./*.xctestrun Debug-iphonesimulator

      - name: Upload test products
        uses: actions/upload-artifact@v7
        with:
          name: test-products
          path: build/products.tar.gz
          retention-days: 1

  test:
    needs: build
    runs-on: macos-26
    timeout-minutes: 60
    name: test (${{ matrix.shard.index }})
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.build.outputs.shards) }}
    env:
      RESULT_BUNDLE: build/UITests-${{ matrix.shard.index }}.xcresult
    steps:
      # TestConfig reads BibleGarden/Debug.xcconfig from the checkout at run time.
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Write Debug.xcconfig
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: scripts/write-ci-debug-xcconfig.sh

      - name: Check test API health
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
            -H "X-API-Key: $API_KEY" "$API_BASE_URL/api/health") || status=unreachable
          if [ "$status" != "200" ]; then
            echo "::error title=Test API unavailable::GET $API_BASE_URL/api/health returned $status. UI tests skip themselves without the API, so the job stops here."
            exit 1
          fi

      - name: Download test products
        uses: actions/download-artifact@v8
        with:
          name: test-products
          path: build

      - name: Unpack test products
        run: |
          mkdir -p build/Products
          tar -xzf build/products.tar.gz -C build/Products

      - name: Boot simulator
        run: scripts/boot-ci-simulator.sh

      - name: Run UI tests
        env:
          ONLY_TESTING: ${{ matrix.shard.only_testing }}
        run: |
          set -o pipefail
          # ONLY_TESTING is a space-separated list of -only-testing options.
          # shellcheck disable=SC2086
          xcodebuild test-without-building \
            -xctestrun "$(ls build/Products/*.xctestrun)" \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -resultBundlePath "$RESULT_BUNDLE" \
            $ONLY_TESTING \
            | xcbeautify --renderer github-actions

      - name: Summarize test results
        if: always() && hashFiles(format('{0}/Info.plist', env.RESULT_BUNDLE)) != ''
        run: |
          xcrun xcresulttool get test-results summary --path "$RESULT_BUNDLE" --compact \
            | jq -r '"| Shard | Result | Passed | Failed | Skipped | Total |", "|---|---|---|---|---|---|",
                     "| ${{ matrix.shard.index }} | \(.result) | \(.passedTests) | \(.failedTests) | \(.skippedTests) | \(.totalTestCount) |"' \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload result bundle
        if: failure() && hashFiles(format('{0}/Info.plist', env.RESULT_BUNDLE)) != ''
        uses: actions/upload-artifact@v7
        with:
          name: UITests-xcresult-${{ matrix.shard.index }}-${{ github.run_attempt }}
          path: ${{ env.RESULT_BUNDLE }}
          retention-days: 14
